<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest?v=17">
<link rel="icon" href="/icon-192.png?v=17" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png?v=17">
<title>Box Box — MotoGP 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="ptr" id="ptr"><div class="ptr-spinner" id="ptr-spinner"></div><span id="ptr-text">Aggiorna</span></div>
<div class="app">
  <header class="topbar">
    <div class="topbar-l">
      <span class="eyebrow" id="topbar-eyebrow">STAGIONE 2026</span>
      <h1 class="title" id="topbar-title">Box Box</h1>
    </div>
    <div class="topbar-r">
      <div id="topbar-r"></div>
      <button class="topbar-btn" id="btn-impostazioni" aria-label="Impostazioni" title="Impostazioni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="mode-toggle" id="mode-toggle">
    <button class="mode-toggle-btn is-active" data-mode="campionato">Campionato</button>
    <button class="mode-toggle-btn" data-mode="fantasygp">FantasyGP</button>
  </div>
  <main>
    <section class="screen is-active" id="s-home" data-stagger></section>
    <section class="screen" id="s-live" data-stagger></section>
    <section class="screen" id="s-standings" data-stagger></section>
    <section class="screen" id="s-fantasy" data-stagger></section>
    <section class="screen" id="s-news" data-stagger></section>
    <section class="screen" id="s-settings" data-stagger></section>
  </main>

  <nav class="bnav" id="bnav">
    <button class="bnav-btn is-active" data-tab="home">
      <span class="bnav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg></span>
      <span class="bnav-lbl">Home</span>
    </button>
    <button class="bnav-btn" data-tab="live">
      <span class="bnav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span>
      <span class="bnav-lbl">Live</span>
    </button>
    <button class="bnav-btn" data-tab="standings">
      <span class="bnav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v4a6 6 0 0 1-12 0z"/><path d="M4 4h2v2a2 2 0 0 1-2 2zM20 4h-2v2a2 2 0 0 0 2 2z"/><path d="M9 14h6l-1 6h-4z"/></svg></span>
      <span class="bnav-lbl">Classifiche</span>
    </button>
    <button class="bnav-btn" data-tab="fantasy">
      <span class="bnav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span>
      <span class="bnav-lbl">Fantasy</span>
    </button>
    <button class="bnav-btn" data-tab="news">
      <span class="bnav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg></span>
      <span class="bnav-lbl">Notizie</span>
    </button>
  </nav>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
